<h1>Анкеты</h1>

{% for resume in resumes %}
    <hr>

    <h3>{{ resume.name }} {{ resume.surname }}</h3>

    <p>Возраст: {{ resume.age }}</p>
    <p>Email: {{ resume.email }}</p>
    <p>Телефон: {{ resume.phone_number }}</p>
    <p>Навыки: {{ resume.skills }}</p>

    <img src="{{ resume.photo.url }}" width="150">

    <br>

    <a href="{{ resume.resume_file.url }}">
        Скачать резюме
    </a>

{% endfor %}
